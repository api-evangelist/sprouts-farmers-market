aid: sprouts-farmers-market
name: Sprouts Farmers Market
description: >-
  Sprouts Farmers Market is a specialty grocery retailer focused on fresh, natural,
  and organic foods at affordable prices. Operating primarily in the western United
  States, Sprouts integrates with third-party platforms including Instacart, DoorDash,
  and Uber Eats for online grocery delivery. Sprouts uses EDI-based supply chain
  integrations and participates in Instacart's AI-powered Cart Assistant program.
  There is no public developer API; integrations are handled through EDI and
  third-party delivery platform partnerships.
